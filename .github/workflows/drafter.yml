name: Interview Drafter

# Runs at 6:30 AM EST (11:30 UTC) daily — 30 minutes before the digest
# so drafts are ready when the briefing arrives.
on:
  schedule:
    - cron: '30 11 * * *'
  workflow_dispatch: # allows manual trigger from GitHub Actions UI

jobs:
  drafter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Write profile from secret
        run: |
          node --input-type=commonjs -e "
            const fs = require('fs');
            fs.writeFileSync('prompts/profile.js', 'export const PROFILE_CONTEXT = ' + JSON.stringify(process.env.PROFILE_CONTEXT) + ';');
          "
        env:
          PROFILE_CONTEXT: ${{ secrets.PROFILE_CONTEXT }}

      - run: node src/index.js --job=draft
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_ACCESS_TOKEN: ${{ secrets.GOOGLE_ACCESS_TOKEN }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          YOUR_EMAIL: ${{ secrets.YOUR_EMAIL }}
          YOUR_NAME: ${{ secrets.YOUR_NAME }}
          PIPELINE_SHEET_ID: ${{ secrets.PIPELINE_SHEET_ID }}
          PIPELINE_SHEET_TAB: ${{ secrets.PIPELINE_SHEET_TAB }}
